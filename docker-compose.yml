version: "3.9"

services:
  # ------------------------------------------------------------------ API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrapling_api
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Override service URLs to use Docker network names
      REDIS_URL: redis://redis:6379/0
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    # Allow the browser-based Scrapling fetchers to run inside the container
    shm_size: "2gb"

  # ----------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: scrapling_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------- MongoDB
  mongo:
    image: mongo:7
    container_name: scrapling_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: scrapling_api
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  mongo_data:
